<script>
const tl = gsap.timeline({ paused: true });
const T = /*__TIMING__*/;
const bn = n => String(Math.round(n)).replace(/[0-9]/g, d => "০১২৩৪৫৬৭৮৯"[d]);

document.querySelectorAll("[data-wave]").forEach(w => {
  for (let i = 0; i < 54; i++) {
    const b = document.createElement("i");
    b.style.height = (12 + Math.abs(Math.sin(i * 1.24) * Math.cos(i * 0.44)) * 66) + "px";
    w.appendChild(b);
  }
});

tl.fromTo("#swipe", { yPercent: 0 }, { yPercent: -100, duration: 0.55, ease: "power3.inOut" }, 0);
tl.fromTo("#slug", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.38 }, 0.18);
tl.fromTo("#head", { opacity: 0, y: 26, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0.3);
tl.fromTo(".fmt", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.08 }, 0.55);
tl.fromTo("#console", { opacity: 0, y: 34, scale: 0.99 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, 0.4);
tl.fromTo("#meta .pill", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.05 }, 0.95);

// click generate at ~2.3s
const click = T.b["gen-1"] + 1.55;
tl.fromTo("#cursor", { opacity: 0, x: 900, y: 760 }, { opacity: 1, x: 900, y: 818, duration: 0.45, ease: "power2.out" }, click - 0.55);
tl.to("#genbtn", { scale: 0.975, backgroundColor: "#4a3ae8", duration: 0.12, yoyo: true, repeat: 1 }, click);
tl.to("#cursor", { opacity: 0, duration: 0.25 }, click + 0.25);
tl.to("#genbtn", { backgroundColor: "#e9e7f3", color: "#8b8aa2", boxShadow: "0 0 0 rgba(91,75,255,0)", duration: 0.3 }, click + 0.3);
tl.fromTo("#progress", { opacity: 0 }, { opacity: 1, duration: 0.3 }, click + 0.35);
tl.fromTo("#ph", { opacity: 1 }, { opacity: 0, duration: 0.25 }, click + 0.3);

const dur = 1.55;
tl.to("#arc", { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, click + 0.4);
tl.to("#pbar", { scaleX: 1, duration: dur, ease: "power2.inOut" }, click + 0.4);
const counter = { v: 0 };
tl.to(counter, { v: 100, duration: dur, ease: "power2.inOut", onUpdate: () => {
  document.getElementById("pct").textContent = bn(counter.v) + "%";
  document.getElementById("st").textContent = counter.v < 45 ? "টেক্সট → স্পিচ…" : counter.v < 85 ? "ভয়েস রেন্ডার হচ্ছে…" : "ফাইনালাইজ…";
} }, click + 0.4);

const done = click + 0.4 + dur + 0.15;
tl.to("#progress", { opacity: 0, duration: 0.25 }, done);
tl.fromTo("#result", { opacity: 0, y: 16, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out" }, done + 0.05);
tl.fromTo("#result .wave i", { scaleY: 0.15 }, { scaleY: 1, duration: 0.35, stagger: 0.005, ease: "power2.out" }, done + 0.1);
tl.fromTo("#success", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.35 }, done + 0.35);
tl.fromTo("#downloads", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35 }, done + 0.5);

// WAV switch at gen-2
const wav = T.b["gen-2"] + 0.15;
tl.to("#o-mp3", { backgroundColor: "#ffffff", color: "#8b8aa2", duration: 0.2 }, wav);
tl.to("#o-wav", { backgroundColor: "#5b4bff", color: "#ffffff", duration: 0.2 }, wav);
tl.set("#fname", { textContent: "Speech_001.wav" }, wav + 0.15);
tl.set("#fmeta", { textContent: "0:07 · 48kHz · 1.4 MB" }, wav + 0.15);
tl.set("#outtag", { textContent: "WAV" }, wav + 0.15);
tl.to("#dl-mp3", { borderColor: "#dedce9", backgroundColor: "#ffffff", color: "#3a3950", duration: 0.2 }, wav + 0.15);
tl.to("#dl-wav", { borderColor: "#5b4bff", backgroundColor: "#f0edff", color: "#3a2fd0", duration: 0.2 }, wav + 0.15);
tl.fromTo("#result", { boxShadow: "0 14px 34px rgba(25,25,60,0.08)" }, { boxShadow: "0 20px 50px rgba(91,75,255,0.22)", duration: 0.4, yoyo: true, repeat: 1 }, wav + 0.15);

</script>
